name: Release Automation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release-automation.yml"
      - ".github/workflows/publish-updates.yml"
      - "ci_scripts/**"
      - "MarkLens/Resources/Info-macOS.plist"
      - "MarkLens.xcodeproj/**"
      - "CHANGELOG.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-automation.yml"
      - ".github/workflows/publish-updates.yml"
      - "ci_scripts/**"
      - "MarkLens/Resources/Info-macOS.plist"
      - "MarkLens.xcodeproj/**"
      - "CHANGELOG.md"

permissions:
  contents: read

jobs:
  release-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install zsh for Xcode Cloud script checks
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - name: Check version and public-key preparation
        run: bash ci_scripts/tests/test_ci_pre_xcodebuild.sh
      - name: Check update publication without uploading
        run: bash ci_scripts/tests/test_ci_post_xcodebuild.sh
